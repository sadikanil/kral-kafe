# Testler canlidaki PHP dalinda (8.4) kosar; once php2shell kapisi.
# Ayrintilar: docs/security/php2shell.md
name: Testler (PHP 8.4)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Composer bagimliliklari
        run: composer install --no-interaction --prefer-dist --no-progress

      # "composer setup" ile ayni: testler .env'deki kafe ayarlarina dayaniyor
      # (orn. SESSION_LIFETIME=900). Anahtar bu is icin uretilir, gizli degil.
      - name: Ortam dosyasi
        run: cp .env.example .env && php artisan key:generate --ansi

      - name: php2shell kapisi (PHP 8.4.27+)
        run: php artisan kafe:php-surumu --kesin

      - name: Testler
        run: php artisan test
