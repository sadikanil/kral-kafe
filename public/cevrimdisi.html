<!DOCTYPE html>
<html lang="tr">
<!--
    Cevrimdisi yedek sayfa (Faz 4). Service worker (sw.js) yalnizca sayfa
    acilamazsa bunu verir; o anda baska dosya gelmeyecegi icin stil icerde.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Bağlantı yok - Kral Kafe</title>
    <style>
        :root { color-scheme: light dark; --bg: #f5f5f7; --kart: #fff; --yazi: #1d1d1f; --ikincil: #6e6e73; --vurgu: #1d1d1f; --vurgu-yazi: #fff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #000; --kart: #1c1c1e; --yazi: #f5f5f7; --ikincil: #a1a1a6; --vurgu: #f5f5f7; --vurgu-yazi: #000; } }
        * { box-sizing: border-box; margin: 0; }
        body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--yazi);
               font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif; text-align: center; }
        main { max-width: 340px; }
        h1 { margin: 16px 0 8px; font-size: 1.5rem; letter-spacing: -0.02em; }
        p { color: var(--ikincil); line-height: 1.45; }
        button { margin-top: 24px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: var(--vurgu); color: var(--vurgu-yazi);
                 font: inherit; font-weight: 600; cursor: pointer; }
        svg { width: 48px; height: 48px; color: var(--ikincil); }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
        <h1>Bağlantı yok</h1>
        <p>İnternet bağlantın kesildi. Çalışma sayacın sunucuda sürüyor; bağlantı gelince kaldığın yerden devam edersin.</p>
        <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
</body>
</html>
