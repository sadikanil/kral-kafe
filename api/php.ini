; php2shell sertlestirmesi (CVE-2026-109618 / CVE-2026-109619, 7 Kasim 2026)
;
; Vercel PHP runtime'i (vercel-php) bu dosyayi kendi php.ini'sinin SONUNA
; ekler ("; [User]" satirindan sonra); ayni anahtarda sonraki deger gecer.
; Baska barindirmada (VPS, paylasimli) ayni satirlar conf.d altina konur:
; docs/security/php2shell.md.
;
; BU AYARLAR YAMANIN YERINI TUTMAZ. Asil cozum yamali PHP (8.4.27+ / 8.5.12+);
; Vercel'de vercel.json -> vercel-php@0.8.0 ve derleme kapisi
; "php artisan kafe:php-surumu --kesin".

; Surum yanit basligina (X-Powered-By) yazilmaz.
expose_php = Off

; Runtime'in kendi php.ini'si display_errors=1 getiriyor. Hata ayrintisi
; ziyaretciye degil loga gider (stderr -> Vercel loglari).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Gecici derinlemesine savunma. Uygulama PHP'nin yerel oturumunu kullanmiyor
; (Laravel'in kendi oturum surucusu var; $_SESSION, session_start ve
; PHP_SESSION_UPLOAD_PROGRESS kodda hic gecmiyor), yukleme ilerlemesi hicbir
; yerde okunmuyor; kapatmak bir sey bozmaz.
session.upload_progress.enabled = Off
